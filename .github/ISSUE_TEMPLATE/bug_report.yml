name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search the existing issues first.
        Security problems go to the Security tab (Report a vulnerability), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a repository with …
        2. Select …
        3. …
  - type: input
    id: version
    attributes:
      label: DiffCode version
      description: DiffCode ▸ About DiffCode, or the commit you built from.
      placeholder: 0.2.0 (2)
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.1 on a MacBook Pro (M3)
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Screenshots, logs, anything else
      description: Please remove anything private (file paths, code, names) before posting.
