# Builds and tests DiffCode's Linux backend. The GTK 3 headers are only needed for the app crate; the core and UI
# tests are platform-neutral.
name: Linux

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/linux.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/linux.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install GTK 3
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgdk-pixbuf-2.0-dev libpango1.0-dev libcairo2-dev

      - name: Test
        working-directory: windows
        run: cargo test --workspace --locked

      - name: Lint
        working-directory: windows
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        working-directory: windows
        run: cargo build -p diffcode --release --locked
