# Releases are built on Windows by .github/workflows/windows.yml, with the C runtime linked in: DiffCode.exe then
# runs on any Windows 10 or 11 without the Visual C++ Redistributable.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Cross-building the Windows binary from a Mac or Linux machine (developer convenience).
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
