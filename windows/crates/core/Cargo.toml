[package]
name = "diffcode-core"
description = "DiffCode's platform-neutral logic: git, diffs, syntax, commits, history."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
encoding_rs = "0.8"
sha2 = "0.10"
unicode-segmentation = "1.12"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Time"] }
trash = { version = "5.2", default-features = false, features = ["coinit_apartmentthreaded"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
